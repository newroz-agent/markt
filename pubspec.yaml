name: zerin_marketplace
description: "Zerin, a premium multi-vendor marketplace for Germany."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.17.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  connectivity_plus: ^7.3.1
  flutter_stripe: ^11.5.0
  url_launcher: ^6.3.2
  # v13 pulls in win32 6 syntax unsupported by the Riverpod 2 generator's analyzer.
  share_plus: 12.0.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  riverpod_generator: 2.6.4
  build_runner: 2.5.4
  freezed: 2.5.8
  json_serializable: 6.9.5
  go_router_builder: 2.8.1
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/

  # Bundled so type renders identically offline and on the first frame.
  # Bricolage Grotesque and Figtree ship as static instances cut from their
  # variable sources; the variable defaults (wght 800 / wght 300) would
  # otherwise render every weight wrong.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-400.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-Italic-400.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Figtree-Italic-600.ttf
          weight: 600
          style: italic
    # Arabic fallback only — this face has no ş/ğ, so it must never be primary.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# Run `dart run flutter_launcher_icons` after dropping the final icon into
# assets/icon/. Expects a 1024x1024 square PNG: dark petrol ground, golden Ẑ.
# The adaptive-icon background is petrol rather than the image, so Android's
# circular mask never clips the mark.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: launcher_icon
  adaptive_icon_background: '#17383E'
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  min_sdk_android: 24
  ios: true
  # iOS rejects any alpha channel in the marketing icon.
  remove_alpha_ios: true
  background_color_ios: '#17383E'
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: '#17383E'
    theme_color: '#E3A93C'
